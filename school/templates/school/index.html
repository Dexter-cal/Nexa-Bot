{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bitende Junior School — Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   ROOT & RESET
═══════════════════════════════════════════ */
:root {
  --m: #7A0000; --ml: #A00000; --md: #4A0000; --mll: #F5ECEC;
  --g: #F5C400; --gl: #FFE066; --gll: #FFF8DC;
  --white: #fff; --f8: #F8F8F8; --f0: #F0F0F0;
  --e: #E0E0E0; --99: #9E9E9E; --66: #616161; --1a: #1A1A1A;
  --gr: #1B5E20; --grl: #E8F5E9;
  --or: #E65100; --orl: #FFF3E0;
  --rd: #B71C1C; --rdl: #FFEBEE;
  --bl: #0D47A1; --bll: #E3F2FD;
  --sb: 248px;
  --sbm: 64px;
  --tb: 58px;
  --rad: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --trans: all 0.22s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;background:var(--f8);color:var(--1a);font-size:14px;overflow-x:hidden}
button,input,select,textarea{font-family:'Outfit',sans-serif}
a{text-decoration:none;color:inherit}
img{max-width:100%}

.school-logo-img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }

/* ═══════════════════════════════════════════
   SPLASH SCREEN
═══════════════════════════════════════════ */
#splash {
  position:fixed;inset:0;z-index:99999;
  background:linear-gradient(135deg,var(--md) 0%,var(--m) 50%,#9A1010 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;
}
.splash-logo-ring {
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,0.1);
  border:3px solid rgba(245,196,0,0.4);
  display:flex;align-items:center;justify-content:center;
  animation:splashPulse 2s ease-in-out infinite;
  margin-bottom:24px;
  overflow: hidden;
}
.splash-logo-inner {
  width:100px;height:100px;border-radius:50%;
  background:var(--g);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
  overflow: hidden;
}
.splash-name {
  font-family:'Playfair Display',serif;font-size:28px;font-weight:900;
  color:#fff;letter-spacing:0.02em;text-align:center;margin-bottom:6px;
  animation:splashSlideUp 0.6s ease-out 0.2s both;
}
.splash-sub {
  font-size:13px;color:rgba(255,255,255,0.55);letter-spacing:0.15em;
  text-transform:uppercase;text-align:center;
  animation:splashSlideUp 0.6s ease-out 0.4s both;
}
.splash-loader {
  margin-top:48px;width:180px;height:3px;
  background:rgba(255,255,255,0.15);border-radius:10px;overflow:hidden;
  animation:splashSlideUp 0.6s ease-out 0.8s both;
}
.splash-loader-bar {
  height:100%;background:var(--g);border-radius:10px;width:0%;
  animation:splashLoad 1.8s ease-in-out 0.9s forwards;
}
@keyframes splashPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,196,0,0.3)}50%{box-shadow:0 0 0 20px rgba(245,196,0,0)}}
@keyframes splashSlideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashLoad{0%{width:0%}60%{width:75%}100%{width:100%}}
#splash.fade-out{animation:splashFade 0.5s ease-out forwards}
@keyframes splashFade{to{opacity:0;pointer-events:none}}

/* ═══════════════════════════════════════════
   LOGIN SCREEN
═══════════════════════════════════════════ */
#login-screen {
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,var(--md) 0%,var(--m) 60%,#9A1010 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;
}
#login-screen.show{display:flex}
.login-card {
  background:#fff;border-radius:24px;padding:40px 36px;
  width:100%;max-width:420px;
  box-shadow:0 24px 80px rgba(0,0,0,0.35);
  animation:loginSlide 0.5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes loginSlide{from{opacity:0;transform:translateY(40px) scale(0.95)}to{opacity:1;transform:none}}
.login-logo-area{text-align:center;margin-bottom:28px}
.login-crest{
  width:80px;height:80px;border-radius:50%;margin:0 auto 12px;
  background:white;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(122,0,0,0.3);
  overflow: hidden;
}
.login-school{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--md); text-align: center;}
.login-title{font-size:16px;font-weight:700;color:var(--1a);margin-bottom:20px;text-align:center}
.form-field{margin-bottom:16px}
.form-field label{display:block;font-size:12px;font-weight:600;color:var(--66);margin-bottom:6px;letter-spacing:0.04em;text-transform:uppercase}
.form-input{
  width:100%;padding:12px 16px;border-radius:10px;
  border:1.5px solid var(--e);font-size:14px;color:var(--1a);
  transition:var(--trans);outline:none;background:#fff;
}
.pw-wrap{position:relative}
.pw-wrap .form-input{padding-right:44px}
.pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--99)}
.login-btn{
  width:100%;padding:14px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--m),var(--ml));
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  transition:var(--trans);margin-top:8px;
  box-shadow:0 4px 16px rgba(122,0,0,0.3);
}
.login-error{background:var(--rdl);color:var(--rd);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;border:1px solid rgba(183,28,28,0.2)}

/* ═══════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════ */
#app{display:none;flex-direction:column;min-height:100vh}
#app.show{display:flex}

.app-topbar {
  height:var(--tb);background:var(--m);
  display:flex;align-items:center;padding:0 20px;
  position:sticky;top:0;z-index:500;
  box-shadow:0 2px 16px rgba(0,0,0,0.2);
  gap:14px;
}
.app-topbar .hamburger{
  width:36px;height:36px;border-radius:10px;border:none;
  background:rgba(255,255,255,0.12);color:#fff;font-size:18px;
  cursor:pointer;display:none;align-items:center;justify-content:center;
  transition:var(--trans);flex-shrink:0;
}
.app-topbar-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.app-topbar-logo .crest{
  width:40px;height:40px;border-radius:50%;background:white;
  display:flex;align-items:center;justify-content:center;
  overflow: hidden;
}
.school-name{font-size:14px;font-weight:700;color:#fff}
.topbar-center{flex:1;display:flex;align-items:center;justify-content:center}
.breadcrumb-bar{font-size:13px;color:rgba(255,255,255,0.6)}
.breadcrumb-bar strong{color:#fff;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.tb-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px 4px 4px;border-radius:10px;transition:var(--trans)}
.tb-user:hover{background:rgba(255,255,255,0.1)}
.tb-user-ava{width:32px;height:32px;border-radius:9px;background:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:var(--md);flex-shrink:0}
.tb-user-name{font-size:12px;color:#fff;font-weight:600}
.tb-icon-btn{
  width:36px;height:36px;border-radius:10px;border:none;
  background:rgba(255,255,255,0.12);color:#fff;font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:var(--trans);position:relative;flex-shrink:0;
}

.layout{display:flex;flex:1;position:relative;overflow:hidden}

.sidebar{
  width:var(--sb);min-width:var(--sb);background:var(--md);
  height:calc(100vh - var(--tb));position:sticky;top:var(--tb);
  overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;
  transition:width 0.3s;
  z-index:200;flex-shrink:0;
}
.sb-nav{flex:1;padding:12px 8px}
.sb-section{
  font-size:9px;letter-spacing:0.18em;color:rgba(255,255,255,0.25);
  text-transform:uppercase;padding:14px 12px 5px;font-weight:700;
  white-space:nowrap; overflow: hidden;
}
.sb-link{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:10px;margin-bottom:2px;
  color:rgba(255,255,255,0.5);font-size:13px;font-weight:500;
  cursor:pointer;transition:var(--trans);
  white-space: nowrap; overflow: hidden;
}
.sb-link:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.85)}
.sb-link.active{background:rgba(245,196,0,0.15);color:var(--g)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;height:calc(100vh - var(--tb))}

/* ═══════════════════════════════════════════
   PAGE COMPONENTS
═══════════════════════════════════════════ */
.page{padding:24px;flex:1;max-width:1600px;width:100%;margin:0 auto}
.page-hero{margin-bottom:24px}
.page-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--1a);line-height:1.15}

.stats{display:grid;gap:14px;margin-bottom:22px}
.stats-4{grid-template-columns:repeat(4,1fr)}
.stat-card{background:var(--white);border-radius:var(--rad);padding:18px 20px;border:1px solid var(--e);position:relative;overflow:hidden;transition:var(--trans)}
.stat-num{font-family:'Playfair Display',serif;font-size:38px;font-weight:700;color:var(--1a);line-height:1}
.stat-label{font-size:11px;color:var(--99);margin-top:5px;font-weight:500}
.stat-accent{position:absolute;bottom:0;left:0;width:100%;height:3px}
.stat-accent.red{background:var(--m)} .stat-accent.gold{background:var(--g)} .stat-accent.blue{background:var(--bl)} .stat-accent.green{background:var(--gr)}

.card{background:var(--white);border-radius:var(--rad);border:1px solid var(--e);overflow:hidden}
.card-head{padding:16px 20px;border-bottom:1px solid var(--f0);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-title{font-size:14px;font-weight:700;color:var(--1a)}
.card-body{padding:18px 20px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:var(--trans);white-space:nowrap}
.btn-primary{background:var(--m);color:#fff;}
.btn-ghost{background:var(--f0);color:var(--66)}
.btn-gold{background:var(--g);color:var(--md)}

.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--99);padding:10px;border-bottom:1px solid var(--e);}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--f0);font-size:13px;}

.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block;white-space:nowrap}
.badge.green{background:var(--grl);color:var(--gr)}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn 0.3s cubic-bezier(.34,1.56,.64,1)}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--f0);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-body{padding:20px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--f0);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--66);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em}
.field-input,.field-select{ width:100%;padding:10px 14px;border-radius:9px; border:1.5px solid var(--e);font-size:13px;color:var(--1a); background:#fff;transition:var(--trans);outline:none; }

.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa-btn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px;border-radius:12px;border:1.5px solid var(--e);background:var(--white);cursor:pointer;transition:var(--trans);font-family:'Outfit',sans-serif}
.qa-btn .qi{font-size:20px}
.qa-btn .ql{font-size:11px;font-weight:600;color:var(--1a);text-align:center;line-height:1.3}

/* Flash Success */
.flash-success{
  position:fixed;top:80px;right:20px;z-index:5000;
  background:var(--gr);color:#fff;padding:12px 20px;border-radius:12px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:8px;
  animation:flashIn 0.4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes flashIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}

@media(max-width:900px){
  .sidebar{position:fixed;top:var(--tb);left:0;bottom:0;transform:translateX(-100%);z-index:300;width:var(--sb)!important;}
  .sidebar.mobile-open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .app-topbar .hamburger{display:flex}
}
</style>
</head>
<body>

<!-- ═══════════ SPLASH SCREEN ═══════════ -->
<div id="splash">
  <div class="splash-logo-ring"><div class="splash-logo-inner"><img src="{% static 'school/assets/logo.jpg' %}" class="school-logo-img"></div></div>
  <div class="splash-name">Bitende Junior School</div>
  <div class="splash-sub">Management System</div>
  <div class="splash-loader"><div class="splash-loader-bar"></div></div>
</div>

<!-- ═══════════ LOGIN SCREEN ═══════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo-area">
      <div class="login-crest"><img src="{% static 'school/assets/logo.jpg' %}" class="school-logo-img"></div>
      <div class="login-school">Bitende Junior School</div>
    </div>
    <div class="login-title">Sign In</div>
    <div class="login-error" id="login-error">❌ Incorrect username or password.</div>
    <div class="form-field"><label>Username</label><input class="form-input" id="login-user" type="text"></div>
    <div class="form-field"><label>Password</label><input class="form-input" id="login-pass" type="password"></div>
    <button class="login-btn" onclick="doLogin()">Sign In →</button>
  </div>
</div>

<!-- ═══════════ APP SHELL ═══════════ -->
<div id="app">
  <header class="app-topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="app-topbar-logo"><div class="crest"><img src="{% static 'school/assets/logo.jpg' %}" class="school-logo-img"></div><div class="school-name">BJS</div></div>
    <div class="topbar-center"><div class="breadcrumb-bar" id="topbar-breadcrumb">Dashboard</div></div>
    <div class="topbar-right">
      <div class="tb-chip">Term 2 · 2025</div>
      <div class="tb-user"><div class="tb-user-ava" id="topbar-ava">AD</div><div class="tb-user-name" id="topbar-name">Admin</div></div>
      <button class="tb-icon-btn" onclick="doLogout()">⏻</button>
    </div>
  </header>

  <div class="layout">
    <div class="sidebar-overlay" id="sb-overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar"><nav class="sb-nav" id="sb-nav-content"></nav></aside>
    <main class="main" id="main-content"></main>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modal-class">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">Manage Class</div><button onclick="closeModal('modal-class')">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Level</label><input class="field-input" id="c-level" placeholder="e.g. P.1"></div>
      <div class="field"><label>Sections (comma separated)</label><input class="field-input" id="c-sections" placeholder="e.g. A, B"></div>
      <div class="field"><label>Annual Fee (UGX)</label><input class="field-input" id="c-fee" type="number"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="saveClass()">Save</button></div>
  </div>
</div>

<script>
const API = {
    async fetch(url, options = {}) {
        const response = await fetch('/api' + url, {
            ...options,
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this.getCookie('csrftoken'), ...options.headers },
        });
        if (!response.ok) throw await response.json();
        return response.json();
    },
    getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
};

let currentUser = null;

const NAV = {
    superadmin: [
        { section: 'Overview' }, { label: 'Dashboard', icon: '⊞', page: 'dashboard' },
        { section: 'Administration' }, { label: 'Classes', icon: '🏫', page: 'classes' }, { label: 'Teachers', icon: '👨‍🏫', page: 'teachers' }, { label: 'Students', icon: '👧', page: 'students' }
    ],
    admin: [
        { section: 'Overview' }, { label: 'Dashboard', icon: '⊞', page: 'dashboard' },
        { section: 'Students' }, { label: 'All Students', icon: '👧', page: 'students' }
    ]
};

window.onload = async () => {
    try {
        currentUser = await API.fetch('/auth/me/');
        enterApp();
    } catch (e) {
        setTimeout(() => {
            document.getElementById('splash').classList.add('fade-out');
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('login-screen').classList.add('show');
            }, 500);
        }, 1500);
    }
};

async function doLogin() {
    const username = document.getElementById('login-user').value;
    const password = document.getElementById('login-pass').value;
    try {
        const res = await API.fetch('/auth/login/', { method: 'POST', body: JSON.stringify({ username, password }) });
        currentUser = res.user;
        enterApp();
    } catch (e) { document.getElementById('login-error').style.display = 'block'; }
}

function doLogout() { API.fetch('/auth/logout/', { method: 'POST' }).then(() => location.reload()); }

function enterApp() {
    document.getElementById('login-screen').classList.remove('show');
    document.getElementById('app').classList.add('show');
    document.getElementById('splash').style.display = 'none';
    document.getElementById('topbar-name').textContent = currentUser.username;
    document.getElementById('topbar-ava').textContent = (currentUser.profile && currentUser.profile.avatar) || 'AD';
    buildSidebar();
    loadPage('dashboard');
}

function buildSidebar() {
    const nav = document.getElementById('sb-nav-content');
    nav.innerHTML = '';
    const role = (currentUser.profile && currentUser.profile.role) || 'superadmin';
    (NAV[role] || NAV.superadmin).forEach(item => {
        if (item.section) nav.innerHTML += `<div class="sb-section">${item.section}</div>`;
        else nav.innerHTML += `<div class="sb-link" onclick="loadPage('${item.page}', this, '${item.label}')"><span class="sb-icon">${item.icon}</span><span class="sb-text">${item.label}</span></div>`;
    });
}

async function loadPage(page, el, label) {
    document.querySelectorAll('.sb-link').forEach(l => l.classList.remove('active'));
    if (el) el.classList.add('active');
    if (label) document.getElementById('topbar-breadcrumb').innerHTML = `<strong>${label}</strong>`;

    const main = document.getElementById('main-content');
    if (page === 'dashboard') {
        const [students, teachers, classes] = await Promise.all([API.fetch('/students/'), API.fetch('/teachers/'), API.fetch('/classes/')]);
        main.innerHTML = `
            <div class="page">
                <div class="page-hero"><div class="page-title">Good morning, ${currentUser.username} 👋</div></div>
                <div class="stats stats-4">
                    <div class="stat-card"><div class="stat-num">${students.length}</div><div class="stat-label">Students</div><div class="stat-accent red"></div></div>
                    <div class="stat-card"><div class="stat-num">${teachers.length}</div><div class="stat-label">Teachers</div><div class="stat-accent gold"></div></div>
                    <div class="stat-card"><div class="stat-num">${classes.length}</div><div class="stat-label">Classes</div><div class="stat-accent blue"></div></div>
                    <div class="stat-card"><div class="stat-num">99%</div><div class="stat-label">System Uptime</div><div class="stat-accent green"></div></div>
                </div>
            </div>`;
    } else if (page === 'classes') {
        const classes = await API.fetch('/classes/');
        let rows = classes.map(c => `<tr><td><strong>${c.level}</strong></td><td>${c.sections.join(', ')}</td><td>UGX ${fmt(c.annual_fee)}</td><td><span class="badge green">Active</span></td></tr>`).join('');
        main.innerHTML = `
            <div class="page">
                <div class="page-hero"><div class="page-title">Class Management</div><button class="btn btn-primary" onclick="openModal('modal-class')">+ Add Class Level</button></div>
                <div class="card"><div class="card-body no-pad"><table class="tbl"><thead><tr><th>Level</th><th>Sections</th><th>Annual Fee</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>
            </div>`;
    } else if (page === 'students') {
        const students = await API.fetch('/students/');
        let rows = students.map(s => `<tr><td>${s.first_name} ${s.last_name}</td><td>${s.student_id}</td><td>${s.status}</td></tr>`).join('');
        main.innerHTML = `
            <div class="page">
                <div class="page-hero"><div class="page-title">Students</div></div>
                <div class="card"><div class="card-body no-pad"><table class="tbl"><thead><tr><th>Name</th><th>ID</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>
            </div>`;
    }
}

async function saveClass() {
    const level = document.getElementById('c-level').value;
    const sections = document.getElementById('c-sections').value.split(',').map(s => s.trim());
    const annual_fee = document.getElementById('c-fee').value;
    await API.fetch('/classes/', { method: 'POST', body: JSON.stringify({ level, sections, annual_fee }) });
    closeModal('modal-class');
    loadPage('classes');
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('mobile-open'); document.getElementById('sb-overlay').classList.toggle('show'); }
function fmt(n) { return Number(n).toLocaleString(); }
function showFlash(msg) {
    const f = document.createElement('div');
    f.className = 'flash-success';
    f.textContent = '✓ ' + msg;
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 3000);
}
</script>
</body>
</html>
