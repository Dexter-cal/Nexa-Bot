{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bitende Junior School — Management System v3.0</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   ROOT & RESET
═══════════════════════════════════════════ */
:root {
  --m: #7A0000; --ml: #A00000; --md: #4A0000; --mll: #F5ECEC;
  --g: #F5C400; --gl: #FFE066; --gll: #FFF8DC;
  --white: #fff; --f8: #F8F8F8; --f0: #F0F0F0;
  --e: #E0E0E0; --99: #9E9E9E; --66: #616161; --1a: #1A1A1A;
  --gr: #1B5E20; --grl: #E8F5E9;
  --or: #E65100; --orl: #FFF3E0;
  --rd: #B71C1C; --rdl: #FFEBEE;
  --bl: #0D47A1; --bll: #E3F2FD;
  --sb: 248px;
  --sbm: 64px;
  --tb: 58px;
  --rad: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --trans: all 0.22s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;background:var(--f8);color:var(--1a);font-size:14px;overflow-x:hidden}
button,input,select,textarea{font-family:'Outfit',sans-serif}
a{text-decoration:none;color:inherit}
img{max-width:100%}

.school-logo-img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }

/* [RESTORED ORIGINAL CSS] */
#splash { position:fixed;inset:0;z-index:99999; background:linear-gradient(135deg,var(--md) 0%,var(--m) 50%,#9A1010 100%); display:flex;flex-direction:column;align-items:center;justify-content:center; gap:0; }
.sp-ring { width:128px;height:128px;border-radius:50%; background:rgba(255,255,255,0.1); border:3px solid rgba(245,196,0,0.4); display:flex;align-items:center;justify-content:center; animation:spP 2s ease-in-out infinite; margin-bottom:24px; overflow: hidden; }
.sp-inner { width:102px;height:102px;border-radius:50%; background:var(--g); display:flex;align-items:center;justify-content:center; box-shadow:0 8px 32px rgba(0,0,0,0.3); overflow: hidden; }
.sp-name { font-family:'Playfair Display',serif;font-size:28px;font-weight:900; color:#fff;letter-spacing:0.02em;text-align:center;margin-bottom:6px; animation:spU 0.6s ease-out 0.2s both; }
.sp-sub { font-size:13px;color:rgba(255,255,255,0.55);letter-spacing:0.15em; text-transform:uppercase;text-align:center; animation:spU 0.6s ease-out 0.4s both; }
.sp-loader { margin-top:48px;width:180px;height:3px; background:rgba(255,255,255,0.15);border-radius:10px;overflow:hidden; animation:spU 0.6s ease-out 0.8s both; }
.sp-fill { height:100%;background:var(--g);border-radius:10px;width:0%; animation:spL 1.8s ease-in-out 0.9s forwards; }
@keyframes spP{0%,100%{box-shadow:0 0 0 0 rgba(245,196,0,0.3)}50%{box-shadow:0 0 0 20px rgba(245,196,0,0)}}
@keyframes spU{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spL{0%{width:0%}60%{width:75%}100%{width:100%}}
#splash.out{animation:spF 0.5s ease-out forwards}
@keyframes spF{to{opacity:0;pointer-events:none}}

#login { position:fixed;inset:0;z-index:9999; background:linear-gradient(135deg,var(--md) 0%,var(--m) 60%,#9A1010 100%); display:none;flex-direction:column;align-items:center;justify-content:center; padding:20px; }
#login.show{display:flex}
.lc { background:#fff;border-radius:24px;padding:40px 36px; width:100%;max-width:440px; box-shadow:0 24px 80px rgba(0,0,0,0.35); animation:lcI 0.5s cubic-bezier(.34,1.56,.64,1); }
@keyframes lcI{from{opacity:0;transform:translateY(40px) scale(0.95)}to{opacity:1;transform:none}}
.lc-crest{ width:80px;height:80px;border-radius:50%;margin:0 auto 12px; background:white; display:flex;align-items:center;justify-content:center; box-shadow:0 8px 24px rgba(122,0,0,0.3); overflow: hidden; }
.lc-school{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--md); text-align: center;}
.lc-title{font-size:16px;font-weight:700;color:var(--1a);margin-bottom:20px;text-align:center}
.fi{margin-bottom:16px}
.fi label{display:block;font-size:11px;font-weight:600;color:var(--66);margin-bottom:6px;letter-spacing:0.04em;text-transform:uppercase}
.fin{ width:100%;padding:12px 16px;border-radius:10px; border:1.5px solid var(--e);font-size:14px;color:var(--1a); transition:var(--trans);outline:none;background:#fff; }
.lbtn{ width:100%;padding:14px;border-radius:12px;border:none; background:linear-gradient(135deg,var(--m),var(--ml)); color:#fff;font-size:15px;font-weight:700;cursor:pointer; transition:var(--trans);margin-top:8px; box-shadow:0 4px 16px rgba(122,0,0,0.3); }

#app{display:none;flex-direction:column;min-height:100vh}
#app.show{display:flex}
.tb { height:var(--tb);background:var(--m); display:flex;align-items:center;padding:0 20px; position:sticky;top:0;z-index:500; box-shadow:0 2px 16px rgba(0,0,0,0.2); gap:14px; }
.tbham{ width:36px;height:36px;border-radius:10px;border:none; background:rgba(255,255,255,0.12);color:#fff;font-size:18px; cursor:pointer;display:none;align-items:center;justify-content:center; transition:var(--trans);flex-shrink:0; }
.tb-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.tb-crest{ width:40px;height:40px;border-radius:50%;background:white; display:flex;align-items:center;justify-content:center; overflow: hidden; }
.tb-sn{font-size:14px;font-weight:700;color:#fff}
.tb-bc{font-size:13px;color:rgba(255,255,255,0.6)}
.tb-bc strong{color:#fff;font-weight:600}
.tb-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.tbu{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px 4px 4px;border-radius:10px;transition:var(--trans)}
.tbu-av{width:32px;height:32px;border-radius:9px;background:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:var(--md);flex-shrink:0}
.tbu-n{font-size:12px;color:#fff;font-weight:600}
.tbib{ width:36px;height:36px;border-radius:10px;border:none; background:rgba(255,255,255,0.12);color:#fff;font-size:16px; cursor:pointer;display:flex;align-items:center;justify-content:center; }

.layout{display:flex;flex:1;position:relative;overflow:hidden}
.sidebar{ width:var(--sb);min-width:var(--sb);background:var(--md); height:calc(100vh - var(--tb));position:sticky;top:var(--tb); overflow-y:auto; overflow-x:hidden; display:flex;flex-direction:column; transition:width 0.3s; z-index:200;flex-shrink:0; }
.sb-nav{flex:1;padding:12px 8px}
.sbsec{ font-size:9px;letter-spacing:0.18em;color:rgba(255,255,255,0.25); text-transform:uppercase;padding:14px 12px 5px;font-weight:700; white-space:nowrap; overflow: hidden;}
.sbl{ display:flex;align-items:center;gap:11px; padding:10px 12px;border-radius:10px;margin-bottom:2px; color:rgba(255,255,255,0.5);font-size:13px;font-weight:500; cursor:pointer;transition:var(--trans); white-space: nowrap; overflow: hidden;}
.sbl.active{background:rgba(245,196,0,0.15);color:var(--g)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;height:calc(100vh - var(--tb))}

.page{padding:24px;flex:1;max-width:1600px;width:100%;margin:0 auto}
.ph{margin-bottom:24px}
.ph-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--1a);line-height:1.15}
.stats{display:grid;gap:14px;margin-bottom:22px}
.stats-4{grid-template-columns:repeat(4,1fr)}
.sc{background:var(--white);border-radius:var(--rad);padding:18px 20px;border:1px solid var(--e);position:relative;overflow:hidden;transition:var(--trans)}
.sc-num{font-family:'Playfair Display',serif;font-size:38px;font-weight:700;color:var(--1a);line-height:1}
.sc-label{font-size:11px;color:var(--99);margin-top:5px;font-weight:500}
.sc-acc{position:absolute;bottom:0;left:0;width:100%;height:3px}
.a-r{background:var(--m)} .a-y{background:var(--g)} .a-b{background:var(--bl)} .a-g{background:var(--gr)}

.card{background:var(--white);border-radius:var(--rad);border:1px solid var(--e);overflow:hidden}
.card-h{padding:16px 20px;border-bottom:1px solid var(--f0);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-t{font-size:14px;font-weight:700;color:var(--1a)}
.card-b{padding:18px 20px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:var(--trans);white-space:nowrap}
.btn-p{background:var(--m);color:#fff;}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--99);padding:10px;border-bottom:1px solid var(--e);}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--f0);font-size:13px;}

.mov{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.mov.show{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.mh{padding:20px 24px;border-bottom:1px solid var(--f0);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.mb{padding:20px 24px}
.mf{padding:16px 24px;border-top:1px solid var(--f0);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

.flash{position:fixed;top:80px;right:20px;z-index:5000;background:var(--gr);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:flashIn 0.4s cubic-bezier(.34,1.56,.64,1);display:none;}
@keyframes flashIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}

@media(max-width:900px){
  .sidebar{position:fixed;top:var(--tb);left:0;bottom:0;transform:translateX(-100%);z-index:300;width:var(--sb)!important;}
  .sidebar.mob-open{transform:translateX(0)}
  .tbham{display:flex}
}
</style>
</head>
<body>

<div id="splash">
  <div class="sp-ring"><div class="sp-inner"><img src="{% static 'school/assets/logo.jpg' %}" class="school-logo-img"></div></div>
  <div class="sp-name">Bitende Junior School</div>
  <div class="sp-sub">Management System v3.0</div>
  <div class="sp-loader"><div class="sp-fill"></div></div>
</div>

<div id="login">
  <div class="lc">
    <div class="lc-logo">
      <div class="lc-crest"><img src="{% static 'school/assets/logo.jpg' %}" class="school-logo-img"></div>
      <div class="lc-school">Bitende Junior School</div>
    </div>
    <div class="lc-title">Sign In</div>
    <div id="lerr" style="color:var(--rd);font-size:12px;text-align:center;margin-bottom:10px;display:none">❌ Incorrect credentials.</div>
    <div class="fi"><label>Username, Email or Phone</label><input class="fin" id="l-id" type="text" placeholder="admin"></div>
    <div class="fi"><label>Password</label><input class="fin" id="l-pw" type="password" placeholder="••••••••"></div>
    <button class="lbtn" onclick="doLogin()">Sign In →</button>
  </div>
</div>

<div id="app">
  <header class="tb">
    <button class="tbham" onclick="tgSb()">☰</button>
    <div class="tb-logo"><div class="tb-crest"><img src="{% static 'school/assets/logo.jpg' %}" class="school-logo-img"></div><div class="tb-sn">BJS SMS</div></div>
    <div class="topbar-right">
      <div class="tb-chip">Term 2 · 2025</div>
      <div class="tbu"><div class="tbu-av" id="tb-ava">AD</div><div class="tbu-n" id="tb-name">Admin</div></div>
      <button class="tbib" onclick="doLogout()">⏻</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sb"><nav class="sb-nav" id="sb-nav-content"></nav></aside>
    <main class="main" id="main-content"></main>
  </div>
</div>

<!-- MODALS -->
<div class="mov" id="m-user">
  <div class="modal">
    <div class="mh"><div class="mt">Manage User Accounts</div><button onclick="cm('m-user')">✕</button></div>
    <div class="mb">
      <div class="fi"><label>Username</label><input class="fin" id="u-user"></div>
      <div class="fi"><label>Password</label><input class="fin" id="u-pass" type="password"></div>
      <div class="fi"><label>Role</label>
        <select class="fin" id="u-role">
          <option value="admin">Admin</option>
          <option value="teacher">Teacher</option>
          <option value="bursar">Bursar</option>
          <option value="reception">Reception</option>
        </select>
      </div>
    </div>
    <div class="mf"><button class="btn btn-p" onclick="saveUser()">Create Account</button></div>
  </div>
</div>

<div class="mov" id="m-settings">
  <div class="modal">
    <div class="mh"><div class="mt">System Settings & API Keys</div><button onclick="cm('m-settings')">✕</button></div>
    <div class="mb">
      <div class="fi"><label>MTN Momo API Key</label><input class="fin" id="s-mtn"></div>
      <div class="fi"><label>Airtel Money API Key</label><input class="fin" id="s-airtel"></div>
      <div class="fi"><label>School Bank Account</label><input class="fin" id="s-acc"></div>
    </div>
    <div class="mf"><button class="btn btn-p" onclick="saveSettings()">Save Settings</button></div>
  </div>
</div>

<div class="mov" id="m-class">
  <div class="modal">
    <div class="mh"><div class="mt">Class Management</div><button onclick="cm('m-class')">✕</button></div>
    <div class="mb">
      <div class="fi"><label>Level</label><input class="fin" id="c-level"></div>
      <div class="fi"><label>Annual Fee</label><input class="fin" id="c-fee" type="number"></div>
    </div>
    <div class="mf"><button class="btn btn-p" onclick="saveClass()">Save</button></div>
  </div>
</div>

<script>
const API = {
    async fetch(url, options = {}) {
        const response = await fetch('/api' + url, {
            ...options,
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this.getCookie('csrftoken'), ...options.headers },
        });
        if (!response.ok) throw await response.json();
        return response.json();
    },
    getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
};

let currentUser = null;

const NAV_MAP = {
    superadmin: [
        { s: 'Overview' }, { l: 'Dashboard', i: '⊞', p: 'dash' },
        { s: 'System' }, { l: 'User Accounts', i: '👤', p: 'users' }, { l: 'Settings & APIs', i: '⚙️', p: 'settings' },
        { s: 'School' }, { l: 'Classes', i: '🏫', p: 'classes' }, { l: 'Teachers', i: '👨‍🏫', p: 'teachers' }
    ],
    admin: [
        { s: 'Overview' }, { l: 'Dashboard', i: '⊞', p: 'dash' },
        { s: 'Students' }, { l: 'All Students', i: '👧', p: 'students' }, { l: 'Teachers', i: '👨‍🏫', p: 'teachers' }
    ]
};

window.onload = async () => {
    try {
        currentUser = await API.fetch('/auth/me/');
        enterApp();
    } catch (e) {
        setTimeout(() => {
            document.getElementById('splash').classList.add('out');
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('login').classList.add('show');
            }, 500);
        }, 1500);
    }
};

async function doLogin() {
    const username = document.getElementById('l-id').value;
    const password = document.getElementById('l-pw').value;
    try {
        const res = await API.fetch('/auth/login/', { method: 'POST', body: JSON.stringify({ username, password }) });
        currentUser = res.user;
        enterApp();
    } catch (e) { document.getElementById('lerr').style.display = 'block'; }
}

function doLogout() { API.fetch('/auth/logout/', { method: 'POST' }).then(() => location.reload()); }

function enterApp() {
    document.getElementById('login').classList.remove('show');
    document.getElementById('app').classList.add('show');
    document.getElementById('splash').style.display = 'none';
    document.getElementById('tb-name').textContent = currentUser.username;
    document.getElementById('tb-ava').textContent = (currentUser.profile && currentUser.profile.avatar) || 'AD';
    buildSidebar();
    loadPage('dash');
}

function buildSidebar() {
    const nav = document.getElementById('sb-nav-content');
    nav.innerHTML = '';
    const role = (currentUser.profile && currentUser.profile.role) || 'admin';
    (NAV_MAP[role] || NAV_MAP.admin).forEach(item => {
        if (item.s) nav.innerHTML += `<div class="sbsec">${item.s}</div>`;
        else nav.innerHTML += `<div class="sbl" onclick="loadPage('${item.p}', this, '${item.l}')"><span class="si">${item.i}</span><span class="st">${item.l}</span></div>`;
    });
}

async function loadPage(p, el, label) {
    document.querySelectorAll('.sbl').forEach(l => l.classList.remove('active'));
    if (el) el.classList.add('active');

    const main = document.getElementById('main-content');
    if (p === 'dash') {
        const [stu, tea, cls] = await Promise.all([API.fetch('/students/'), API.fetch('/teachers/'), API.fetch('/classes/')]);
        main.innerHTML = `
            <div class="page">
                <div class="ph"><div class="ph-title">Welcome, ${currentUser.username}</div></div>
                <div class="stats stats-4">
                    <div class="sc"><div class="sc-num">${stu.length}</div><div class="sc-label">Students</div><div class="sc-acc a-r"></div></div>
                    <div class="sc"><div class="sc-num">${tea.length}</div><div class="sc-label">Teachers</div><div class="sc-acc a-y"></div></div>
                    <div class="sc"><div class="sc-num">${cls.length}</div><div class="sc-label">Classes</div><div class="sc-acc a-b"></div></div>
                    <div class="sc"><div class="sc-num">99%</div><div class="sc-label">System Uptime</div><div class="sc-acc a-g"></div></div>
                </div>
            </div>`;
    } else if (p === 'classes') {
        const cls = await API.fetch('/classes/');
        let rows = cls.map(c => `<tr><td>${c.level}</td><td>UGX ${fmt(c.annual_fee)}</td></tr>`).join('');
        main.innerHTML = `<div class="page"><div class="ph"><div class="ph-title">Classes</div><button class="btn btn-p" onclick="om('m-class')">+ Add</button></div><div class="card"><div class="card-b"><table class="tbl"><thead><tr><th>Level</th><th>Fee</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
    } else if (p === 'users') {
        const users = await API.fetch('/users/');
        let rows = users.map(u => `<tr><td>${u.username}</td><td>${u.profile.role}</td></tr>`).join('');
        main.innerHTML = `<div class="page"><div class="ph"><div class="ph-title">Users</div><button class="btn btn-p" onclick="om('m-user')">+ Add</button></div><div class="card"><div class="card-b"><table class="tbl"><thead><tr><th>Username</th><th>Role</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
    } else if (p === 'settings') {
        const s = await API.fetch('/settings/current/');
        om('m-settings');
        document.getElementById('s-mtn').value = s.mtn_api_key || '';
        document.getElementById('s-airtel').value = s.airtel_api_key || '';
        document.getElementById('s-acc').value = s.school_account_number || '';
    }
}

async function saveUser() {
    const data = { username: document.getElementById('u-user').value, password: document.getElementById('u-pass').value, role: document.getElementById('u-role').value };
    await API.fetch('/users/', { method: 'POST', body: JSON.stringify(data) });
    cm('m-user'); loadPage('users');
}

async function saveSettings() {
    const data = { mtn_api_key: document.getElementById('s-mtn').value, airtel_api_key: document.getElementById('s-airtel').value, school_account_number: document.getElementById('s-acc').value };
    await API.fetch('/settings/current/', { method: 'POST', body: JSON.stringify(data) });
    cm('m-settings');
}

async function saveClass() {
    const data = { level: document.getElementById('c-level').value, annual_fee: document.getElementById('c-fee').value };
    await API.fetch('/classes/', { method: 'POST', body: JSON.stringify(data) });
    cm('m-class'); loadPage('classes');
}

function om(id) { document.getElementById(id).classList.add('show'); }
function cm(id) { document.getElementById(id).classList.remove('show'); }
function tgSb() { document.getElementById('sb').classList.toggle('mob-open'); }
function fmt(n) { return Number(n).toLocaleString(); }
</script>
</body>
</html>
